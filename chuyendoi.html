<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body>
    <script>
        const FOOT_TO_METER_RATE = 0.305;
        const METER_TO_FOOT_RATE = 3.279;
        function isInvalid (value) {
            return (value.trim() === "" ||
                    !Number.isFinite(Number(value)) ||
                    Number(value)<0
                );
        }
        function footToMeter (foot) {
            return foot * FOOT_TO_METER_RATE;
        }
        function meterToFoot (meter) {
            return meter * METER_TO_FOOT_RATE;
        }
        let choice = Number(prompt("Chọn kiểu chuyển đổi:\n1. Foot -> Meter\n2. Meter -> Foot"));
        if (choice===1) {
            const input = prompt("Nhập vào foot: ");
            if (isInvalid(input)) {
                console.log("Dữ liệu không hợp lệ");
            } else {
                const foot = Number(input);
                console.log(`${foot} foot = ${footToMeter(foot).toFixed(2)} meter`);
            }
        }
        else if (choice===2) {
            const input = prompt("Nhập vào meter: ");
            if (isInvalid(input)) {
                console.log("Dữ liệu không hợp lệ");
            } else {
            const meter = Number(input);
            console.log(`${meter} meter = ${meterToFoot(meter).toFixed(2)} foot`);
            }
        }
        else {
            console.log("Lựa chọn không hợp lệ");
        }
    </script>
</body>
</html>
